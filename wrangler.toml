name = "football"
compatibility_date = "2026-09-25"

# Static SPA served as Cloudflare Workers static assets (no worker script —
# just the built Vite output). `single-page-application` fallback serves
# index.html for any unmatched path so React Router's client-side routes
# (e.g. /game/daily-top10) don't 404 on a hard refresh. Using this instead
# of a public/_redirects catch-all, which Wrangler rejects here as an
# infinite loop against its own built-in clean-URL redirect.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
